/* Based on https://github.com/jaredlll08/MultiLoader-Template/ */

plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Make Nullable's available
    compileOnly 'com.google.code.findbugs:jsr305:+'
}

loom {
    def aw = project(':loader-common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Loader-fabric: Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Loader-fabric: Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        gameTest {
            server()
            setConfigName('Loader-fabric: GameTestServer')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            vmArg "-Dfabric-api.gametest"
        }
    }
}

task runGameTestServer {
    dependsOn tasks.runGameTest
}

// Measure coverage for game tests
jacoco {
    applyTo runGameTest
}
jacocoTestReport {
    dependsOn test, runGameTest
    // Include unit and game test coverage
    executionData fileTree(project.buildDir).include("jacoco/*.exec")
}

